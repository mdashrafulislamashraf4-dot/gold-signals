services:
  - type: web
    name: gold-signals
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPERATING_MODE
        value: "PAPER"
      - key: TIMEZONE
        value: Asia/Dhaka
      - key: SIGNAL_CHECK_INTERVAL
        value: "5"
      - key: RISK_PER_TRADE
        value: "0.25"
      - key: MAX_DAILY_LOSS_PCT
        value: "1.0"
      - key: ENABLE_DAILY_LOSS_LIMIT
        value: "true"
      - key: ENABLE_CONSECUTIVE_LOSS_LIMIT
        value: "false"
      - key: MAX_CONSECUTIVE_LOSSES
        value: "0"
      - key: GOLD_SYMBOL
        value: GC=F
      - key: TIMEFRAMES
        value: 15m,5m,1m
